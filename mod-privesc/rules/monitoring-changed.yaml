id: privesc-monitoring-changed
name: "Privilege escalation: auditd configuration changed"
category: defense-evasion
type: privilege-escalation
severity: medium
kind: match
when:
  method: file
  sensitive_group: audit_config
  writer_allowed: {not: true}
  action: none
  ignored: {not: true}
description: "{path} was changed by {uri} (session of {vhost}): the configuration or the rules of auditd. It is expected while auditd is updated or its administrator changes its rules; otherwise someone may be blinding the monitoring."
search: "module:privesc path:{path:q}"
